<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KeyChange — Open Graph card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--paper:#f6edda;--card:#fff8e8;--ink:#17130c;--red:#ff2e1f;--blue:#2233ff;--yellow:#ffc700;--green:#0e7a4f}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:"Space Grotesk",sans-serif;cursor:none}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;
    background-image:radial-gradient(rgba(23,19,12,.16) 1.2px,transparent 1.4px);background-size:16px 16px}
  .card::after{content:"";position:absolute;inset:0;pointer-events:none;border:10px solid var(--ink)}
  .staff{position:absolute;left:-3%;right:-3%;top:150px;transform:rotate(-2deg);opacity:.9}
  .staff i{display:block;height:3px;background:var(--ink);margin:46px 0}
  .rays{position:absolute;top:-220px;left:50%;transform:translateX(-50%);width:1300px;height:800px;opacity:.5;
    background:repeating-conic-gradient(from 0deg at 50% 0%,var(--yellow) 0 6deg,transparent 6deg 12deg);
    -webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent 72%);
    mask-image:radial-gradient(closest-side,#000 30%,transparent 72%)}
  .top{position:absolute;top:28px;left:38px;right:38px;display:flex;align-items:center;gap:14px;z-index:3}
  .brand{font-family:Unbounded;font-weight:900;font-size:19px;letter-spacing:.03em;background:var(--yellow);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--red);padding:8px 14px;transform:rotate(-2deg)}
  .tag{font-family:"JetBrains Mono";font-size:11px;font-weight:700;letter-spacing:.16em;background:var(--ink);color:var(--paper);padding:7px 11px}
  .free{margin-left:auto;font-family:"JetBrains Mono";font-size:11px;font-weight:700;letter-spacing:.12em;background:var(--green);color:#fff;border:2px solid var(--ink);padding:7px 11px;transform:rotate(1.5deg)}
  .mid{position:absolute;left:52px;top:118px;z-index:3}
  h1{font-family:Unbounded;font-weight:900;font-size:116px;line-height:.92;letter-spacing:-.02em;text-transform:uppercase}
  h1 .line{display:block;white-space:nowrap}
  h1 em{font-style:normal;display:inline-block;background:var(--red);color:#fff;border:4px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:0 16px;transform:rotate(-2deg)}
  h1 .out{color:var(--paper);-webkit-text-stroke:3px var(--ink);text-shadow:5px 5px 0 var(--ink)}
  h1 .serif{font-family:"Instrument Serif";font-style:italic;font-weight:400;text-transform:none;background:var(--yellow);border:4px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:0 16px;display:inline-block;font-size:1.08em;transform:rotate(-1deg)}
  h1 .blue{background:var(--blue);transform:rotate(1.5deg)}
  .sub{margin-top:22px;margin-left:4px;font-size:20px;font-weight:500;max-width:820px;line-height:1.35;background:var(--paper);box-shadow:0 0 0 8px var(--paper);display:inline-block;position:relative;z-index:4}
  .sub b{background:var(--yellow);border:2px solid var(--ink);padding:0 5px}
  .star{position:absolute;right:92px;top:196px;width:132px;height:132px;background:var(--red);border:3px solid var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;transform:rotate(9deg);z-index:4;
    clip-path:polygon(50% 0%,61% 12%,76% 6%,80% 21%,95% 21%,92% 36%,107% 43%,99% 56%,110% 68%,95% 73%,94% 89%,79% 86%,71% 100%,58% 90%,45% 100%,37% 86%,22% 89%,22% 73%,7% 68%,18% 56%,10% 43%,25% 36%,22% 21%,37% 21%,41% 6%,56% 12%);}
  .star span{font-family:Unbounded;font-weight:900;font-size:12px;line-height:1.05}
  .keys{position:absolute;left:0;right:0;bottom:0;height:112px;display:flex;background:#1b1a16;border-top:5px solid var(--ink);z-index:2;padding:0 0}
  .key{flex:1;background:linear-gradient(#fffdf4,#e8e0cc);border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-bottom:none;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;font-family:Unbounded;font-weight:900;font-size:20px;color:var(--ink)}
  .key:first-child{border-left:none}
  .key .b{position:absolute;top:0;right:-30%;width:60%;height:62%;background:linear-gradient(#333,#000);border:2px solid #000;border-radius:0 0 5px 5px;z-index:2;color:var(--yellow);font-family:"JetBrains Mono";font-weight:700;font-size:12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
  .keys{overflow:hidden}
  .key:last-child .b{display:none}
  .foot{position:absolute;bottom:126px;left:52px;right:52px;display:flex;justify-content:space-between;align-items:center;font-family:"JetBrains Mono";font-size:11px;font-weight:700;letter-spacing:.14em;z-index:3}
  .foot span{background:var(--ink);color:var(--yellow);padding:6px 10px}
  .foot span:last-child{background:var(--yellow);color:var(--ink);border:2px solid var(--ink)}
</style>
</head>
<body>
<div class="card">
  <div class="rays"></div>
  <div class="staff"><i></i><i></i><i></i><i></i><i></i></div>

  <div class="top">
    <span class="brand">KEYCHANGE</span>
    <span class="tag">MIDI TEXT INSTRUMENT · v2.4</span>
    <span class="free">FREE FOREVER</span>
  </div>

  <div class="mid">
    <h1>
      <span class="line"><em>PLAY</em> <span class="out">YOUR</span></span>
      <span class="line"><span class="serif">words</span> <em class="blue">LOUD.</em></span>
    </h1>
    <p class="sub">Your MIDI piano <b>is</b> your keyboard now. Every key types. Every chord shortcuts.</p>
  </div>

  <div class="star"><span>88<br>KEYS<br>ZERO<br>CLACK</span></div>

  <div class="foot">
    <span>VELOCITY = BOLD · SUSTAIN = SPACE · CHORDS = SHORTCUTS</span>
    <span>PLAY YOUR WORDS →</span>
  </div>

  <div class="keys" aria-hidden="true">
    <div class="key"><span class="b">!</span>a</div>
    <div class="key"><span class="b">?</span>b</div>
    <div class="key">c</div>
    <div class="key"><span class="b">@</span>d</div>
    <div class="key"><span class="b">#</span>e</div>
    <div class="key"><span class="b">.</span>f</div>
    <div class="key">g</div>
    <div class="key"><span class="b">:</span>h</div>
    <div class="key"><span class="b">;</span>i</div>
    <div class="key">j</div>
    <div class="key"><span class="b">,</span>k</div>
    <div class="key"><span class="b">…</span>l</div>
    <div class="key"><span class="b">‽</span>m</div>
    <div class="key">n</div>
    <div class="key">o</div>
  </div>
</div>
</body>
</html>
